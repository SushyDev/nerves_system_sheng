#
# Real Qualcomm ABL A/B, boot_a/boot_b + rootfs_a/rootfs_b (layout derived in
# board/xiaomi_sheng/gpt/). Standalone, not wired into `mix firmware`. OTA
# built by ../scripts/build-ota.sh, applied via NervesSheng.ABUpdate.apply/1.
#
# boot-a.img/boot-b.img differ only in root=PARTLABEL cmdline - never swap slots.
#
# gpt-primary-slot-*.bin = real bytes captured from `fastboot set_active`
# (also shipped on-target for ABUpdate's revert path, raw-write without
# needing this .fw). Real A/B state = GPT attr byte + type-GUID swap, not
# the AOSP misc struct - also needs the UFS bBootLunEn write (ufs_boot_lun).
# Done via execute() in on-finish below (needs --unsafe) so both writes are
# one fwup transaction instead of two separate host-side processes with a
# crash window between them - GPT write happens first since it's the
# bigger/slower one, LUN flip last since it's the closest thing to atomic
# this device offers.
#
# Primary GPT only - PBL/XBL/ABL never read the backup, and this device's
# stock backup GPT is already stale.
#
# Disk letter (/dev/sdX) isn't stable across boots - caller re-resolves via
# sysfs and passes -d fresh every time.
#
require-fwup-version="1.12.0"

# meta-* is embedded in the .fw archive (readable via `fwup -m`, already
# used by `mix upload`'s UUID display) but does NOT automatically become a
# runtime a./b.nerves_fw_* KV key on this device - no uboot-environment
# resource exists to do that copy for us like uboot_setenv would elsewhere,
# and meta-* fields aren't readable back as ${...} once set (verified: only
# define()'d variables are) - so each value needs its own define() as the
# one source of truth, used both to set meta-* and, in each upgrade.<slot>
# task's on-finish, to write the KV file directly via execute(), the same
# way it already writes the boot-LUN.
define(META_PRODUCT, "nerves_sheng")
define(META_DESCRIPTION, "Xiaomi Pad 6S Pro (sheng) Nerves firmware")
define(META_VERSION, "${NERVES_SHENG_VERSION}")
define(META_AUTHOR, "SushyDev")
define(META_PLATFORM, "xiaomi_sheng")
define(META_ARCHITECTURE, "aarch64")

meta-product="${META_PRODUCT}"
meta-description="${META_DESCRIPTION}"
meta-version="${META_VERSION}"
meta-author="${META_AUTHOR}"
meta-platform="${META_PLATFORM}"
meta-architecture="${META_ARCHITECTURE}"

define(KV_ENV_DIR, "/data/nerves_sheng")
define(KV_ENV_FILE, "/data/nerves_sheng/kv.env")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "PARTLABEL=data")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/data")

define(BOOT_A_PART_OFFSET, 652336)
define(BOOT_A_PART_COUNT, 393216)
define(BOOT_B_PART_OFFSET, 2336920)
define(BOOT_B_PART_COUNT, 393216)

# rootfs_a/rootfs_b: 4GiB each, GPT LBA 3094592/4143168 (4096B sectors,
# see generate-userdata-gpt.py) x8 -> fwup's 512B block unit. assert-size-lte
# is the full partition size, not the ~1.1GB resource's actual size.
define(ROOTFS_A_PART_OFFSET, 24756736)
define(ROOTFS_B_PART_OFFSET, 33145344)
define(ROOTFS_PART_COUNT, 8388608)

# Primary GPT: protective MBR + header + 96-entry table, LBA0, 40x512B blocks.
define(GPT_PRIMARY_OFFSET, 0)
define(GPT_PRIMARY_COUNT, 40)

file-resource boot-a.img {
    host-path = ${BOOT_A_IMG}
    assert-size-lte = ${BOOT_A_PART_COUNT}
}

file-resource boot-b.img {
    host-path = ${BOOT_B_IMG}
    assert-size-lte = ${BOOT_B_PART_COUNT}
}

# Shared by both tasks (each writes it to a different offset) - a second
# resource pointing at the same host-path would embed the content twice,
# since only one of upgrade.a/upgrade.b ever runs per apply but fwup embeds
# every declared resource at archive-creation time regardless.
file-resource rootfs.img {
    host-path = ${ROOTFS_IMG}
    assert-size-lte = ${ROOTFS_PART_COUNT}
}

file-resource gpt-primary-slot-a.bin {
    host-path = "${NERVES_SYSTEM}/board/xiaomi_sheng/gpt/gpt-primary-slot-a.bin"
    assert-size-lte = ${GPT_PRIMARY_COUNT}
}

file-resource gpt-primary-slot-b.bin {
    host-path = "${NERVES_SYSTEM}/board/xiaomi_sheng/gpt/gpt-primary-slot-b.bin"
    assert-size-lte = ${GPT_PRIMARY_COUNT}
}

# Resource order = write order, so GPT commits last. Caller must only
# invoke this when B is currently active (checked via GPT bits, not here).
task upgrade.a {
    on-init {
        info("Writing new kernel + rootfs to slot A, then activating it")
    }

    on-resource boot-a.img { raw_write(${BOOT_A_PART_OFFSET}) }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }
    on-resource gpt-primary-slot-a.bin { raw_write(${GPT_PRIMARY_OFFSET}) }

    on-finish {
        execute("mkdir -p ${KV_ENV_DIR} && printf 'a.nerves_fw_product=${META_PRODUCT}\na.nerves_fw_description=${META_DESCRIPTION}\na.nerves_fw_version=${META_VERSION}\na.nerves_fw_author=${META_AUTHOR}\na.nerves_fw_platform=${META_PLATFORM}\na.nerves_fw_architecture=${META_ARCHITECTURE}\na.nerves_fw_application_part0_devpath=${NERVES_FW_APPLICATION_PART0_DEVPATH}\na.nerves_fw_application_part0_fstype=${NERVES_FW_APPLICATION_PART0_FSTYPE}\na.nerves_fw_application_part0_target=${NERVES_FW_APPLICATION_PART0_TARGET}\n' >> ${KV_ENV_FILE}")
        execute("ufs_boot_lun write a")
        info("Slot A activated. Reboot to apply.")
    }
}

task upgrade.b {
    on-init {
        info("Writing new kernel + rootfs to slot B, then activating it")
    }

    on-resource boot-b.img { raw_write(${BOOT_B_PART_OFFSET}) }
    on-resource rootfs.img { raw_write(${ROOTFS_B_PART_OFFSET}) }
    on-resource gpt-primary-slot-b.bin { raw_write(${GPT_PRIMARY_OFFSET}) }

    on-finish {
        execute("mkdir -p ${KV_ENV_DIR} && printf 'b.nerves_fw_product=${META_PRODUCT}\nb.nerves_fw_description=${META_DESCRIPTION}\nb.nerves_fw_version=${META_VERSION}\nb.nerves_fw_author=${META_AUTHOR}\nb.nerves_fw_platform=${META_PLATFORM}\nb.nerves_fw_architecture=${META_ARCHITECTURE}\nb.nerves_fw_application_part0_devpath=${NERVES_FW_APPLICATION_PART0_DEVPATH}\nb.nerves_fw_application_part0_fstype=${NERVES_FW_APPLICATION_PART0_FSTYPE}\nb.nerves_fw_application_part0_target=${NERVES_FW_APPLICATION_PART0_TARGET}\n' >> ${KV_ENV_FILE}")
        execute("ufs_boot_lun write b")
        info("Slot B activated. Reboot to apply.")
    }
}
