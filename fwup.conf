#
# Real Qualcomm ABL A/B for boot_a/boot_b (kernel only) - rootfs stays a
# single ext2 in userdata, deployed separately by scripts/bake_release.sh.
# Standalone: not wired into `mix firmware` (no squashfs pipeline here),
# applied via a dedicated OTA path instead.
#
# gpt-primary-slot-*.bin are real captured bytes from `fastboot set_active`,
# not synthesized - see board/xiaomi_sheng/gpt/. Real A/B state = GPT attr
# byte (offset 54/entry) + type-GUID swap, NOT the AOSP misc-partition
# struct. GPT alone won't boot - also need the UFS bBootLunEn write, see
# package/ufs_boot_lun/.
#
# Primary GPT only: PBL/XBL/ABL never read the backup, and this device's
# own backup GPT is already stale/incomplete in stock firmware.
#
# Disk letter (/dev/sdX) is NOT stable across boots - caller must
# re-resolve via sysfs and pass -d fresh every time.
#
require-fwup-version="1.12.0"

define(BOOT_A_PART_OFFSET, 652336)
define(BOOT_A_PART_COUNT, 393216)
define(BOOT_B_PART_OFFSET, 2336920)
define(BOOT_B_PART_COUNT, 393216)

# Primary GPT: protective MBR + header + 96-entry table, LBA0, 40x512B blocks.
define(GPT_PRIMARY_OFFSET, 0)
define(GPT_PRIMARY_COUNT, 40)

file-resource boot.img {
    host-path = ${BOOT_IMG}
    assert-size-lte = ${BOOT_A_PART_COUNT}
}

file-resource gpt-primary-slot-a.bin {
    host-path = "${NERVES_SYSTEM}/board/xiaomi_sheng/gpt/gpt-primary-slot-a.bin"
    assert-size-lte = ${GPT_PRIMARY_COUNT}
}

file-resource gpt-primary-slot-b.bin {
    host-path = "${NERVES_SYSTEM}/board/xiaomi_sheng/gpt/gpt-primary-slot-b.bin"
    assert-size-lte = ${GPT_PRIMARY_COUNT}
}

# Resource order = write order, so GPT commits last. Caller must only
# invoke this when B is currently active (checked via GPT bits, not here).
task upgrade.a {
    on-init {
        info("Writing new kernel to boot_a, then activating slot A")
    }

    on-resource boot.img { raw_write(${BOOT_A_PART_OFFSET}) }
    on-resource gpt-primary-slot-a.bin { raw_write(${GPT_PRIMARY_OFFSET}) }

    on-finish {
        info("Slot A activated. Reboot to apply.")
    }
}

task upgrade.b {
    on-init {
        info("Writing new kernel to boot_b, then activating slot B")
    }

    on-resource boot.img { raw_write(${BOOT_B_PART_OFFSET}) }
    on-resource gpt-primary-slot-b.bin { raw_write(${GPT_PRIMARY_OFFSET}) }

    on-finish {
        info("Slot B activated. Reboot to apply.")
    }
}
