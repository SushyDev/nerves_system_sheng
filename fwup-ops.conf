#
# Runtime ops for Nerves.Runtime.FwupOps (status/revert/validate) - built
# once via `fwup -c` and checked into board/xiaomi_sheng/rootfs_overlay/
# usr/share/fwup/ops.fw, NOT rebuilt automatically on every firmware build
# (see fwup.conf for why: no squashfs/mix-firmware pipeline here, and the
# same reasoning applies - this is a standalone artifact).
#
# All three tasks are thin execute() wrappers around package/ab_ops/ - fwup
# can't branch on which slot is active (no duplicate task names allowed,
# confirmed) or feed a subprocess's stdout into info() (info() only takes a
# compile-time string), so all the actual logic lives in that C helper,
# mirroring lib/nerves_sheng/ab_update.ex bit-for-bit. See ab_ops.c's own
# header comment for the exact protocol (fwup --framing WN-frame format)
# the "status" task depends on - verified byte-for-byte against
# deps/nerves_runtime/lib/nerves_runtime/fwup_ops.ex's decode/1 before
# writing this, entirely on the host, no hardware involved.
#
require-fwup-version="1.12.0"

task status {
    on-init {
        execute("ab_ops status")
    }
}

task validate {
    on-init {
        execute("ab_ops validate")
    }
}

task revert {
    on-init {
        execute("ab_ops revert")
    }
}
