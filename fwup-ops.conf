#
# Runtime ops for Nerves.Runtime.FwupOps (status/revert/validate) - built
# once via `fwup -c`, checked into rootfs_overlay/usr/share/fwup/ops.fw,
# not rebuilt per firmware build (standalone artifact, same as fwup.conf).
#
# All three tasks are thin execute() wrappers around package/ab_ops/ - fwup
# can't branch on active slot or pipe subprocess stdout into info(), so the
# real logic lives in that C helper. "status" task's output format is
# verified byte-for-byte against fwup_ops.ex's decode/1 - see ab_ops.c's
# header for the protocol.
#
require-fwup-version="1.12.0"

task status {
    on-init {
        execute("ab_ops status")
    }
}

task validate {
    on-init {
        execute("ab_ops validate")
    }
}

task revert {
    on-init {
        execute("ab_ops revert")
    }
}
